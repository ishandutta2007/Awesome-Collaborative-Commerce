<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="420" style="background: #0B0F19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070A11" />
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.03)" />
    </linearGradient>

    <!-- Filters & Glows -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
      <circle cx="40" cy="40" r="1" fill="rgba(255, 255, 255, 0.08)" />
    </pattern>
  </defs>

  <!-- Base Layer -->
  <rect width="1200" height="420" fill="url(#bg-grad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <g opacity="0.6">
    <circle cx="150" cy="90" r="120" fill="#38BDF8" opacity="0.15" filter="url(#glow-cyan)">
      <animate attributeName="cx" values="150;180;150" dur="10s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.15;0.25;0.15" dur="7s" repeatCount="indefinite" />
    </circle>
    <circle cx="1020" cy="310" r="140" fill="#8B5CF6" opacity="0.18" filter="url(#glow-purple)">
      <animate attributeName="cy" values="310;280;310" dur="12s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.18;0.28;0.18" dur="8s" repeatCount="indefinite" />
    </circle>
    <circle cx="600" cy="380" r="100" fill="#EC4899" opacity="0.12" filter="url(#glow-purple)">
      <animate attributeName="r" values="100;120;100" dur="9s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Dynamic Animated Network Connection Lines -->
  <g stroke="rgba(56, 189, 248, 0.18)" stroke-width="1.5" stroke-dasharray="6,6">
    <line x1="200" y1="340" x2="400" y2="340">
      <animate attributeName="stroke-dashoffset" values="0;24" dur="3s" repeatCount="indefinite" />
    </line>
    <line x1="500" y1="340" x2="700" y2="340">
      <animate attributeName="stroke-dashoffset" values="0;24" dur="3s" repeatCount="indefinite" />
    </line>
    <line x1="800" y1="340" x2="1000" y2="340">
      <animate attributeName="stroke-dashoffset" values="0;24" dur="3s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Dynamic Flowing Particle / Data Packets -->
  <circle cx="300" cy="340" r="3.5" fill="#38BDF8">
    <animate attributeName="cx" values="180;420;180" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="600" cy="340" r="3.5" fill="#818CF8">
    <animate attributeName="cx" values="480;720;480" dur="4.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.2;1;0.2" dur="4.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="900" cy="340" r="3.5" fill="#C084FC">
    <animate attributeName="cx" values="780;1020;780" dur="5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.2;1;0.2" dur="5s" repeatCount="indefinite" />
  </circle>

  <!-- Foreground Content: Header Tag Badge -->
  <g transform="translate(600, 65)">
    <rect x="-180" y="-18" width="360" height="36" rx="18" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.2" />
    <circle cx="-150" cy="0" r="5" fill="#10B981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="0" y="5" fill="#38BDF8" font-size="13" font-weight="600" letter-spacing="1.5" text-anchor="middle">
      CURATED ECOSYSTEM &#x2022; SAAS &amp; OPEN-SOURCE
    </text>
  </g>

  <!-- Foreground Title -->
  <g transform="translate(600, 140)">
    <text x="0" y="0" text-anchor="middle" font-size="44" font-weight="800" fill="url(#title-grad)" letter-spacing="-0.8">
      Awesome Collaborative Commerce
    </text>
  </g>

  <!-- Foreground Subtitle -->
  <g transform="translate(600, 185)">
    <text x="0" y="0" text-anchor="middle" font-size="18" font-weight="400" fill="#94A3B8" letter-spacing="0.2">
      Multi-Vendor Marketplaces &#x2022; Dropship Networks &#x2022; Supplier Onboarding &#x2022; Commission Management
    </text>
  </g>

  <!-- Foreground Feature Pills (Elevated & Crisp) -->
  <g transform="translate(180, 240)">
    <!-- Pill 1: Multi-Vendor -->
    <g transform="translate(0, 0)">
      <rect width="180" height="42" rx="10" fill="rgba(255, 255, 255, 0.04)" stroke="url(#card-border)" stroke-width="1" />
      <text x="90" y="26" text-anchor="middle" fill="#E2E8F0" font-size="13.5" font-weight="500">
        &#x1F6D2; Multi-Vendor Engines
      </text>
    </g>

    <!-- Pill 2: Dropship Networks -->
    <g transform="translate(210, 0)">
      <rect width="190" height="42" rx="10" fill="rgba(255, 255, 255, 0.04)" stroke="url(#card-border)" stroke-width="1" />
      <text x="95" y="26" text-anchor="middle" fill="#E2E8F0" font-size="13.5" font-weight="500">
        &#x1F4E6; Dropship Sync
      </text>
    </g>

    <!-- Pill 3: Split Payouts -->
    <g transform="translate(430, 0)">
      <rect width="190" height="42" rx="10" fill="rgba(255, 255, 255, 0.04)" stroke="url(#card-border)" stroke-width="1" />
      <text x="95" y="26" text-anchor="middle" fill="#E2E8F0" font-size="13.5" font-weight="500">
        &#x1F4B8; Split Commissions
      </text>
    </g>

    <!-- Pill 4: B2B Wholesale -->
    <g transform="translate(650, 0)">
      <rect width="190" height="42" rx="10" fill="rgba(255, 255, 255, 0.04)" stroke="url(#card-border)" stroke-width="1" />
      <text x="95" y="26" text-anchor="middle" fill="#E2E8F0" font-size="13.5" font-weight="500">
        &#x1F91D; B2B &amp; Net Terms
      </text>
    </g>
  </g>

  <!-- Network Node Indicators (Subtle Bottom Architecture Graph) -->
  <g transform="translate(600, 340)">
    <!-- Central Node -->
    <circle cx="0" cy="0" r="16" fill="rgba(129, 140, 248, 0.2)" stroke="#818CF8" stroke-width="2" />
    <circle cx="0" cy="0" r="6" fill="#818CF8" />

    <!-- Left Node 1 -->
    <circle cx="-160" cy="0" r="12" fill="rgba(56, 189, 248, 0.2)" stroke="#38BDF8" stroke-width="1.8" />
    <circle cx="-160" cy="0" r="4.5" fill="#38BDF8" />

    <!-- Left Node 2 -->
    <circle cx="-320" cy="0" r="10" fill="rgba(56, 189, 248, 0.15)" stroke="#38BDF8" stroke-width="1.5" />
    <circle cx="-320" cy="0" r="3.5" fill="#38BDF8" />

    <!-- Right Node 1 -->
    <circle cx="160" cy="0" r="12" fill="rgba(192, 132, 252, 0.2)" stroke="#C084FC" stroke-width="1.8" />
    <circle cx="160" cy="0" r="4.5" fill="#C084FC" />

    <!-- Right Node 2 -->
    <circle cx="320" cy="0" r="10" fill="rgba(192, 132, 252, 0.15)" stroke="#C084FC" stroke-width="1.5" />
    <circle cx="320" cy="0" r="3.5" fill="#C084FC" />
  </g>

  <!-- Bottom Accent Border -->
  <rect x="0" y="416" width="1200" height="4" fill="url(#title-grad)" />
</svg>
